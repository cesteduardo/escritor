<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="capa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5fb4"/><stop offset=".08" stop-color="#3584e4"/><stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="argola" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/><stop offset=".5" stop-color="#c0bfbc"/><stop offset="1" stop-color="#77767b"/>
    </linearGradient>
    <linearGradient id="caneta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbe6f"/><stop offset=".45" stop-color="#ff7800"/><stop offset="1" stop-color="#c64600"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c0bfbc"/><stop offset="1" stop-color="#77767b"/>
    </linearGradient>
  </defs>

  <!-- capa: espessura embaixo, como nos ícones do GNOME -->
  <rect x="20" y="16" width="88" height="100" rx="9" fill="#1a5fb4"/>
  <rect x="20" y="12" width="88" height="100" rx="9" fill="url(#capa)"/>

  <!-- maço de folhas -->
  <rect x="31" y="18" width="71" height="90" rx="4" fill="#c0bfbc"/>
  <rect x="31" y="16" width="71" height="89" rx="4" fill="#deddda"/>
  <rect x="31" y="14" width="71" height="88" rx="4" fill="url(#folha)"/>

  <!-- pauta -->
  <g stroke="#99c1f1" stroke-width="1.5" opacity=".55">
    <path d="M40 34h54M40 44h54M40 54h54M40 64h54M40 74h54M40 84h54M40 94h54"/>
  </g>
  <path d="M44 22v80" stroke="#f66151" stroke-width="1.5" opacity=".5"/>

  <!-- texto escrito -->
  <g stroke="#3d3846" stroke-linecap="round">
    <path d="M50 31h34" stroke-width="3.2"/>
    <g stroke-width="2.4" opacity=".75">
      <path d="M50 41h40"/><path d="M50 51h36"/><path d="M50 61h28"/><path d="M50 71h16"/>
    </g>
  </g>

  <!-- espiral -->
  <g>
    <g fill="#241f31" opacity=".35">
      <circle cx="31" cy="27" r="2.6"/><circle cx="31" cy="43" r="2.6"/><circle cx="31" cy="59" r="2.6"/><circle cx="31" cy="75" r="2.6"/><circle cx="31" cy="91" r="2.6"/>
    </g>
    <g fill="url(#argola)" stroke="#5e5c64" stroke-width=".8">
      <rect x="15" y="23" width="19" height="6" rx="3"/>
      <rect x="15" y="39" width="19" height="6" rx="3"/>
      <rect x="15" y="55" width="19" height="6" rx="3"/>
      <rect x="15" y="71" width="19" height="6" rx="3"/>
      <rect x="15" y="87" width="19" height="6" rx="3"/>
    </g>
  </g>

  <!-- caneta, escrevendo no fim da última linha -->
  <g transform="translate(95 46) rotate(45) scale(.88)">
    <!-- sombra da caneta sobre a folha -->
    <path d="M-6.5 -32 h13 v58 l-6.5 16 l-6.5 -16 z" fill="#241f31" opacity=".16" transform="translate(-4 5)"/>
    <path d="M-6 26 L0 42 L6 26 Z" fill="url(#metal)"/>
    <path d="M-1.6 37 L0 42 L1.6 37 Z" fill="#241f31"/>
    <rect x="-6.5" y="20" width="13" height="7" rx="1.5" fill="url(#metal)"/>
    <rect x="-6.5" y="-26" width="13" height="47" rx="3" fill="url(#caneta)"/>
    <rect x="-6.5" y="-32" width="13" height="9" rx="4" fill="#9a9996"/>
    <rect x="-6.5" y="-32" width="13" height="5" rx="2.5" fill="#c0bfbc"/>
    <rect x="3" y="-28" width="2.6" height="22" rx="1.3" fill="#deddda" stroke="#77767b" stroke-width=".5"/>
    <rect x="-4.5" y="-22" width="2.2" height="38" rx="1.1" fill="#ffffff" opacity=".35"/>
  </g>
</svg>
